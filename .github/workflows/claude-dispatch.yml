name: Claude — manual prompt runner

on:
  workflow_dispatch:
    inputs:
      prompt_file:
        description: "Saved prompt to run (ignored if free-text prompt is filled in)"
        required: true
        type: choice
        default: test-coverage-gaps.md
        options:
          - idor-tenant-isolation.md
          - n-plus-one-queries.md
          - secret-scan.md
          - security-audit.md
          - public-endpoints.md
          - dead-code.md
          - api-versioning.md
          - test-coverage-gaps.md
      prompt:
        description: "Free-text prompt — overrides the saved prompt above when non-empty"
        required: false
        type: string
        default: ""
      model:
        description: "Model to run with"
        required: true
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      scope:
        description: "Optional path to focus on, e.g. apps/web"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-prompt:
    name: Run prompt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The job summary for a plain workflow_dispatch run (no PR/issue in the
      # triggering event) only ever shows Claude's raw tool-call trace, not a
      # synthesized report — that polished card only renders when the action
      # posts an actual PR/issue comment. So Claude gets its own throwaway
      # issue to report into, closed once it's posted.
      - name: Create report issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_FILE: ${{ inputs.prompt_file }}
        run: |
          set -euo pipefail
          TITLE="Claude dispatch: ${PROMPT_FILE:-free-text} — ${GITHUB_REF_NAME}"
          URL="$(gh issue create --title "${TITLE}" \
            --body "Running on \`${GITHUB_REF_NAME}\`. Report posts below when the run finishes.")"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "number=${URL##*/}" >> "${GITHUB_OUTPUT}"
          echo "Report issue: ${URL}" >> "${GITHUB_STEP_SUMMARY}"

      # Inputs are bound to env rather than interpolated into the script body.
      # Interpolating ${{ inputs.prompt }} directly into run: would let prompt
      # text terminate the shell command and execute arbitrary code.
      - name: Resolve prompt
        id: resolve
        env:
          FREE_TEXT: ${{ inputs.prompt }}
          PROMPT_FILE: ${{ inputs.prompt_file }}
          SCOPE: ${{ inputs.scope }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          if [ -n "${FREE_TEXT}" ]; then
            SOURCE="free-text"
            BODY="${FREE_TEXT}"
          else
            SOURCE=".github/prompts/${PROMPT_FILE}"
            if [ ! -f "${SOURCE}" ]; then
              echo "::error::Prompt file not found: ${SOURCE}"
              exit 1
            fi
            BODY="$(cat "${SOURCE}")"
          fi

          echo "Prompt source: ${SOURCE}"

          {
            echo "body<<CLAUDE_PROMPT_EOF"
            echo "REPO: ${GITHUB_REPOSITORY}"
            echo "BRANCH: ${GITHUB_REF_NAME}"
            if [ -n "${SCOPE}" ]; then
              echo "SCOPE: restrict your analysis to the path '${SCOPE}'"
            fi
            echo ""
            echo "${BODY}"
            echo ""
            echo "---"
            echo ""
            echo "REPORT DELIVERY: your response in this conversation is not seen by"
            echo "anyone. When your analysis is complete, write the report (following"
            echo "the Output format section above, verbatim structure — the emoji"
            echo "verdict line, the collapsible <details> blocks) to .claude-dispatch-report.md"
            echo "using your file-write tool. Do not run gh yourself and do not post"
            echo "anything — a separate step posts .claude-dispatch-report.md as issue"
            echo "#${ISSUE_NUMBER} for you once you finish."
            echo "CLAUDE_PROMPT_EOF"
          } >> "${GITHUB_OUTPUT}"

      # Claude only writes .claude-dispatch-report.md — it never gets the repo-write
      # token itself. inputs.prompt is free text on a manual dispatch, and
      # the agent also reads repo files during analysis, either of which is
      # a prompt-injection vector; keeping gh (and its contents/PR/issues
      # write scope) out of Claude's own shell caps what an injection could
      # do to "wrote a bad file," not "used a write-scoped token."
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.resolve.outputs.body }}
          claude_args: --model ${{ inputs.model }} --max-turns 60

      - name: Post report
        if: always() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.issue.outputs.number }}"
          if [ -f .claude-dispatch-report.md ]; then
            gh issue comment "${NUM}" --body-file .claude-dispatch-report.md
          else
            gh issue comment "${NUM}" --body "⚠️ Claude run finished without writing .claude-dispatch-report.md — check the job log for what happened."
          fi
          gh issue close "${NUM}"
